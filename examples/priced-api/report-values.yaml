meta:
  updated: 2026-10-24
  rule: every value the two documents print exists here; each renders it at whatever precision it needs
  rounding: >-
    A value carries what the register works out of the point record and its export, and rounds
    only at print. Every dollar value is a D ref of ../metrics.yaml, so `point finish`, `values
    pull` and `check` reach it by one piece of arithmetic over the exported prices
  note: >-
    The rates behind every dollar value are INVENTED (scripts/manifests/opencost.yaml): what is
    real is the arithmetic from those rates and the measured replicas, requests and windows to a
    cost per point. Checked by `report-kit values --path examples/priced-api/report-values.yaml
    check`.

scan:
  - report.md
  - execution.md

# What one point of the sweep adds: `report-kit values add-point
# scripts/data/<run>.point.json`.
points:
  axis: rate
  label: "r{rate:02d}"
  values:
    offered_{point}: {kind: R, unit: req_per_second, display: 0, from: {metric: R21}}
    served_{point}: {kind: M, unit: req_per_second, display: 2, from: {metric: M1}}
    requests_{point}: {kind: R, unit: requests, display: 0, from: {metric: R5}}
    p95_{point}: {kind: M, unit: milliseconds, display: 0, from: {metric: M2}}
    requested_{point}: {kind: D, unit: usd_per_hour, display: 5, from: {metric: D13}}
    allocated_{point}: {kind: D, unit: usd_per_hour, display: 5, from: {metric: D14}}
    own_cost_{point}: {kind: D, unit: usd, display: 6, from: {metric: D18}}
    shared_cost_{point}: {kind: D, unit: usd, display: 5, from: {metric: D19}}
    per_thousand_{point}: {kind: D, unit: usd, display: 4, from: {metric: D20}}

values:
