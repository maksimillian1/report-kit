# How to reach the cluster, and nothing else. What is read is ../metrics.yaml;
# when a point is over and whether it counts is ../execution.yaml.
namespace: report-kit-priced
poll_seconds: 3
max_wait_seconds: 300

prometheus:
  url: http://localhost:9092
  service: svc/prometheus
  namespace: report-kit-priced-monitoring
  mapping: "9092:9090"

api:
  service: svc/mock-api
  namespace: report-kit-priced
  mapping: "8082:18080"

# What execution.yaml's prices_match_aws checks the control-plane fee against.
# Read only when the register sums kubecost_cluster_management_cost; a local
# cluster has no EKS name, and this execution does not run the check.
# eks_cluster: ⟨name⟩

# {rate} {duration} {summary} {log} {run} are filled in by api_point.py.
# --summary-export is what M1/M2/M3 and R5 are read from: on a serving path the
# client's own view is the measurement, and Prometheus supplies the server
# side and the prices.
generator:
  command: ["k6", "run", "--quiet",
            "--summary-export", "{summary}",
            "-e", "TARGET_RATE={rate}",
            "-e", "DURATION={duration}",
            "-e", "BASE_URL=http://localhost:8082",
            "load.js"]
