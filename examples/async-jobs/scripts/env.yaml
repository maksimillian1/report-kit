# How to reach the cluster, and nothing else. What is read is ../metrics.yaml;
# when a point is over and whether it counts is ../execution.yaml.
namespace: report-kit-jobs
poll_seconds: 3
max_wait_seconds: 900

prometheus:
  url: http://localhost:9092
  service: svc/prometheus
  namespace: report-kit-jobs
  mapping: "9092:9090"

# The queue, reached through a port-forward like everything else. Ports differ
# from the api example's on purpose: both clusters can be up at once.
redis:
  address: localhost:6380
  service: svc/redis
  namespace: report-kit-jobs
  mapping: "6380:6379"

# Every key the runner touches, named here rather than in the script. The
# close condition is "all of these are empty", so adding a queue is a line
# in this file, as it is under sqs: for jobs_point.py.
queues:
  work: jobs:work
  retry: jobs:retry

# Counters that outlive the pods. A worker pool that scales to zero takes its
# /metrics with it, so anything checked at the window's close has to be kept
# somewhere that is still running when the close happens.
counters:
  enqueued: jobs:enqueued
  completed: jobs:done
  retried: jobs:retried

worker:
  deployment: worker
  scaledobject: worker
  selector: app=worker

# {count} {rate} {run} {log} are filled in by point.py. The producer is named
# here so the runner stays independent of what puts work in the queue.
producer:
  command: ["python3", "produce.py",
            "--redis", "localhost:6380",
            "--queue", "jobs:work",
            "--enqueued-key", "jobs:enqueued",
            "--count", "{count}",
            "--rate", "{rate}"]
