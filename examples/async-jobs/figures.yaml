    unit: units_per_second
    source: D9 of n08-relief, the first pass's probe with the shared tier's ceiling at 4; data/n08-relief.point.json
    group: first_pass

  efficiency_drop_n02_n04:
    ref: FD16
    kind: D
    formula: efficiency_n02 - efficiency_n04
    unit: percentage_points
    display: 0
    source: how far per-worker efficiency falls across the knee. Stated in 3.3 as a relationship between two figures, which makes it a figure
    group: efficiency

  efficiency_gap_n08:
    ref: FD17
    kind: D
    formula: 100 - efficiency_n08
    unit: percent
    display: 0
    source: the per-worker efficiency unaccounted for at the top of the grid — the "missing 30 %" the Coverage table declares unseparated
    group: efficiency

  window_rate_n08:
    ref: FD18
    kind: D
    formula: units_per_point / window_n08
    unit: units_per_second
    display: 1
    source: what n08-long's rate would read if it were averaged over the window instead of the drain. Half of the pair 5 quotes; the other half is FM9
    group: constraint

  relief_apparent_gain:
    ref: FD19
    kind: D
    formula: (rate_p1_relief - rate_p1_n08) / rate_p1_n08 * 100
    unit: percent
    display: 0
    source: the improvement the first pass's relief probe appeared to produce. It produced none — M6 shows the shared tier at one replica through both drains — and the figure exists so the number in 7 is checked rather than recalled
    group: first_pass

