    unit: percent
    display: 0
    group: efficiency
    appears_in: [report.md, execution.md]

  efficiency_n08b:
    ref: FD10
    kind: D
    formula: speedup_n08b / ceiling_n08 * 100
    unit: percent
    display: 0
    group: efficiency

  tier_service_rise:
    ref: FD11
    kind: D
    formula: (tier_service_n08b - tier_service_n01) / tier_service_n01 * 100
    unit: percent
    display: 0
    source: how little the shared tier's service time moved across the grid. Half of the pair that rules the tier out as the constraint
    group: constraint

  throughput_rise:
    ref: FD12
    kind: D
    formula: (rate_n08 - rate_n01) / rate_n01 * 100
    unit: percent
    display: 0
    source: the load the tier absorbed while its service time barely moved
    group: constraint
    appears_in: [report.md, execution.md]

  repeat_spread:
    ref: FD13
    kind: D
    formula: (rate_n08 - rate_n08b) / rate_n08b * 100
    unit: percent
    display: 0
    source: the gap between two identical points, which sets the resolution of every comparison here. Base is the repeat, so the figure reads as how much the first point overstated the second
    group: constraint

  retry_units:
    ref: FD14
    kind: D
    formula: units_per_point / 20
    unit: units
    display: 0
    source: one unit in twenty, deterministic (unit n retries when n % 20 == 0)
    group: workload

  total_burns:
    ref: FD15
    kind: D
    formula: units_per_point + retry_units
    unit: units
    display: 0
    source: what the workers actually execute, retries included
    group: workload

  expected_tier_ceiling:
    ref: FE1
    kind: E
    formula: 1000 / tier_ms
    unit: units_per_second
    display: 1
    source: >-
      the Expected line, written before the first run: two replicas at 500m is one core, and at
      60 ms per unit that is this many units/s. Wrong, and report 3.5 says why: it priced wall
      time as though it were exclusive CPU. A colon inside a plain scalar would end the value
      here, which is why this one is a block scalar
    group: expected

  expected_single_worker:
    ref: FE2
    kind: E
    formula: 1000 / (worker_ms + tier_ms)
    unit: units_per_second
    display: 1
    source: the same Expected line, for one worker running both costs serially
    group: expected

  units_first_pass:
    ref: FR9
    kind: R
    value: 400
    unit: units
    display: 0
    source: the first pass's unit count. Not a row of the matrix — its drains were ramp-dominated — but the report names it when it says why those rows are excluded
    group: workload

  window_n08:
    ref: FM21
    kind: M
    value: 84.8
    unit: seconds
    display: 1
    source: the measured window of n08-long, drain plus scale-in; data/n08-long.point.json
    group: constraint

  rate_p1_n08:
    ref: FM22
    kind: M
    value: 12.74
    unit: units_per_second
    source: D9 of the first pass's n08 point at 400 units; data/n08.point.json. Registered because 7 quotes the pair it belongs to
    group: first_pass

  rate_p1_relief:
    ref: FM23
    kind: M
