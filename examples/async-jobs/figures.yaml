meta:
  updated: 2026-09-09
  rule: every figure the two documents print exists here; each renders it at whatever precision it needs
  rounding: >-
    D9 is measured, not derived from D8, and that is deliberate. The drain is published rounded
    to a tenth of a second, so 1200 / 50.3 gives 23.86 where the point record says 23.85. The
    rate was computed from the unrounded drain, and re-deriving it here from the printed one
    would quietly disagree with the evidence. Arithmetic at full precision, rounded once at
    print -- which also means you cannot recover the precision a document threw away.
  note: >-
    Checked by `report-kit figures --path examples/async-jobs/figures.yaml check`.
    D9 is measured rather than derived from D8 — see meta.rounding.

scan:
  - report.md
  - execution.md

figures:
  units_per_point:
    ref: FR1
    kind: R
    value: 1200
    unit: units
    display: 0
    source: the second pass's unit count, a Held constant. The first pass ran 400 and its rows are a different grid

  offered_rate:
