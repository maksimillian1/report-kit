# The metric register: every ref this execution defines, once. scripts/point.py
# reads it; `report-kit metrics write` renders the register table from it.

metrics:
  # Every query here reads the queue exporter or the shared tier, both of which
  # are still running when the window closes. Nothing here is read from the
  # worker pods: they scale to zero at the end of every point, and a series that
  # disappears with its pod cannot be exported for the window it belongs to.
  M1:
    what: work queue depth
    promql: max(jobs_queue_depth{queue="work"})
    status: confirmed 2026-10-22
    notes: published by the queue exporter, which never scales to zero
  M2:
    what: retry queue depth
    promql: max(jobs_queue_depth{queue="retry"})
    status: confirmed 2026-10-22
    notes: rises *after* M1 reads empty — the retries are produced by the work
  M3:
    what: units in flight
    promql: max(jobs_inflight)
    status: confirmed 2026-10-22
    notes: '`enqueued − completed − M1 − M2`. A popped unit is in no queue and in no counter; this is the only place it appears'
  M4:
    what: worker pods serving
    promql: count(up{job="worker"} == 1)
    status: confirmed 2026-10-22
    notes: '**scrape targets, not replicas.** Has fewer samples than every other ref in every export here — the pool is absent at both ends of the window, which is the profile, not a gap'
  M5:
    what: completion rate
    promql: sum(rate(jobs_completed_total[30s]))
    status: confirmed 2026-10-22
    notes: from a Redis counter, so it survives the pool going away
  M6:
    what: shared-tier pods
    promql: count(up{job="results"} == 1)
    status: confirmed 2026-10-22
  M7:
    what: shared-tier concurrency
    promql: sum(rate(results_seconds_total[30s]))
    status: confirmed 2026-10-22
    notes: service-seconds per second = mean concurrency inside the handler. Wall time, so CPU throttling inflates it
  D8:
    what: drain duration
    record: drain_window.seconds
    status: active
    notes: producer start to the first poll at which `outstanding` reads 0, as the runner timed it; ±1 poll (3 s)
  D9:
    what: sustained drain rate
    record: drained_per_second
    status: active
    notes: 'the headline of a jobs point: units completed ÷ D8, divided by the runner before D8 was rounded'
  D10:
    what: shared-tier mean service time
    series: {ref: M7, per: M5, where: "M5 > 1", reduce: mean}
    status: active
    notes: seconds; samples where M5 ≤ 1 are the tier idling, and dividing by them measures nothing
  R11:
    what: what the pool actually did
    source: read off M4 per point
    status: active
    notes: carried in the ledger's `Signal` column
  R12:
    what: worker pool ceiling, the swept axis
    record: n
    status: active
    notes: maxReplicaCount on the ScaledObject, set by point.py before preflight
  R13:
    what: units enqueued per point
    record: count
    status: active
  R14:
    what: offered rate, units per second
    record: offered_rate
    status: active
    notes: produce.py --rate, an open model
