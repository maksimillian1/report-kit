    group: constraint

  throughput_rise:
    ref: VD12
    kind: D
    formula: (rate_n08 - rate_n01) / rate_n01 * 100
    unit: percent
    display: 0
    source: the load the tier absorbed while its service time barely moved
    group: constraint
    appears_in: [report.md, execution.md]

  repeat_spread:
    ref: VD13
    kind: D
    formula: (rate_n08b - rate_n08) / rate_n08b * 100
    unit: percent
    display: 0
    source: the gap between two identical points, which sets the resolution of every comparison here. Base is the repeat, and the repeat came out the faster of the two, so the value reads as how much the first point understated the second. The documents print it as a spread, which is why the subtraction runs faster minus slower
    group: constraint

  retry_units:
    ref: VD14
    kind: D
    formula: units_per_point / 20
    unit: units
    display: 0
    source: one unit in twenty, deterministic (unit n retries when n % 20 == 0)
    group: workload

  total_burns:
