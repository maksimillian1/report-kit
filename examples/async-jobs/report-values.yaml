meta:
  updated: 2026-10-22
  rule: every value the two documents print exists here; each renders it at whatever precision it needs
  rounding: >-
    D8 and D9 are worked out of each point's record by metrics.yaml, not stored by the runner: D8
    is events.drained - events.load_started, both epoch seconds kept unrounded, and D9 is the
    completed count over D8. A value carries that full precision and rounds only at print, so a
    rate the documents print to two places and a drain they print to one are the same arithmetic
    the record holds, never one recomputed from the other's printed form -- you cannot recover
    the precision a document threw away.
  note: >-
    Checked by `report-kit values --path examples/async-jobs/report-values.yaml check`.
    Every value a run's data holds reads it by its register ref -- from: {metric: D9} -- so
    metrics.yaml defines it once and the kind follows the ref: a value read from D9 is derived.
    `values pull` writes it, `check` fails if it drifts, `values trace` follows it to the data.

scan:
  - report.md
  - execution.md
  - charts/*.csv

# What one point of the 1200-unit grid adds: `report-kit values add-point
# scripts/data/<run>.point.json`. A repeat of a label gets the next letter, so
# n08b is n08-long-b, the repeat of n08-long. The values of the five grid
# points written before this block were bound with `values adopt-point`.
# Everything else stays unbound on purpose: the held constants, the first
# pass at 400 units (which held: refuses), window_n08 and the rate over it,
# the estimates, and the comparisons that span several points.
points:
  axis: n
  label: "n{n:02d}"
  held: {count: units_per_point, offered_rate: offered_rate}
  values:
    ceiling_{point}: {kind: R, unit: workers, display: 0, from: {metric: R12}}
    drain_{point}: {kind: D, unit: seconds, display: 1, from: {metric: D8}}
    rate_{point}: {kind: D, unit: units_per_second, from: {metric: D9}}
    tier_service_{point}: {kind: D, unit: milliseconds, display: 1, from: {metric: D10, scale: 1000}}
    peak_queue_{point}: {kind: M, unit: units, display: 0, from: {ref: M1, reduce: max}, metric: M1}
    speedup_{point}: {kind: D, unit: ratio, formula: "rate_{point} / rate_n01", group: speedup}
    efficiency_{point}: {kind: D, unit: percent, display: 0, formula: "speedup_{point} / ceiling_{point} * 100", group: efficiency}

values:
