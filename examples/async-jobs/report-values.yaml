meta:
  updated: 2026-10-22
  rule: every value the two documents print exists here; each renders it at whatever precision it needs
  rounding: >-
    D9 is measured, not derived from D8, and that is deliberate. The drain is published rounded
    to a tenth of a second, so 1200 / 59.6 gives 20.13 where the point record says 20.14. The
    rate was computed from the unrounded drain, and re-deriving it here from the printed one
    would quietly disagree with the evidence. Arithmetic at full precision, rounded once at
    print -- which also means you cannot recover the precision a document threw away.
  note: >-
    Checked by `report-kit values --path examples/async-jobs/report-values.yaml check`.
    D9 is measured rather than derived from D8 — see meta.rounding. Every value a run's data
    holds names it with from:, so `values pull` writes the value and `check` fails if it drifts.

scan:
  - report.md
  - execution.md
  - charts/*.csv

# What one point of the 1200-unit grid adds: `report-kit values add-point
# scripts/data/<run>.point.json`. A repeat of a label gets the next letter, so
# n08b is n08-long-b, the repeat of n08-long. The values of the five grid
# points written before this block were bound with `values adopt-point`.
# Everything else stays unbound on purpose: the held constants, the first
# pass at 400 units (which held: refuses), window_n08 and the rate over it,
# the estimates, and the comparisons that span several points.
points:
  axis: n
  label: "n{n:02d}"
  held: {count: units_per_point, offered_rate: offered_rate}
  values:
    ceiling_{point}: {kind: R, unit: workers, display: 0, from: {path: n}, source: "maxReplicaCount, as the point record carries it"}
    drain_{point}: {kind: M, unit: seconds, display: 1, from: {path: drain_window.seconds}, metric: D8}
    rate_{point}: {kind: M, unit: units_per_second, from: {path: drained_per_second}, metric: D9}
    tier_service_{point}: {kind: M, unit: milliseconds, display: 1, from: {ref: M7, per: M5, where: M5 > 1, reduce: mean, scale: 1000}, metric: D10}
    peak_queue_{point}: {kind: M, unit: units, display: 0, from: {ref: M1, reduce: max}, metric: M1}
    speedup_{point}: {kind: D, unit: ratio, formula: "rate_{point} / rate_n01", group: speedup}
    efficiency_{point}: {kind: D, unit: percent, display: 0, formula: "speedup_{point} / ceiling_{point} * 100", group: efficiency}

values:
