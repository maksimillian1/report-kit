# How a point of this execution is run and judged: what it is run with, when
# its window closes, and what makes the point valid. scripts/jobs_point.py
# reads it beside metrics.yaml. Neither may change between points of one sweep.

point:
  settings:
    n: {}                       # the worker pool ceiling, the swept axis
    count: {}                   # units enqueued, held within a pass
    rate: {default: '40'}       # units offered per second, open model
  load: background
  # Above the ScaledObject's cooldownPeriod (20 s), or the hold completes while
  # the pool is still winding down. keda/scaledobject.yaml says so from its side.
  hold_seconds: 30
  freeze: [deployment/worker, deployment/results]
  # The scrape interval: a drain is a minute or two, and a queue-depth curve
  # sampled six times is not a curve.
  step: 5s
  guards_at: window_end

window_closes_when_back_to_idle:
  # The always-on tier the workers lean on: it scales up under load and must
  # come back down for the window to close. The queues and the worker pool are
  # jobs_point.py's own.
  results:
    idle_replicas: 1

point_validity_guards:
  # What makes a point invalid, not what makes it
  # interesting. A guard that fires because the pool saturated would be a
  # finding; these fire only when the run did not measure what it claims to.
  #
  # Checked at the window's close, so every query here has to read a series that
  # still exists then — see the note above M1.
  #
  # G1 is the conservation check and the reason the counters live in Redis. Every
  # unit enqueued is completed exactly once; anything left over was dropped by a
  # worker that went away holding it, and the drain time below is then a time to
  # do less work than the point claims.
  G1:
    max: 0
    promql: max(jobs_enqueued_total) - max(jobs_completed_total)
  G2:
    min: '{count}'
    promql: max(jobs_enqueued_total)
  G3:
    max: 0
    promql: max(jobs_queue_depth{queue="work"}) + max(jobs_queue_depth{queue="retry"})
  G4:
    min: 1
    metric: M6
