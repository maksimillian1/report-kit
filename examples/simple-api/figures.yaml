meta:
  updated: 2026-09-21
  rule: every figure the two documents print exists here; each renders it at whatever precision it needs
  rounding: >-
    A figure carries what the point record carries, and rounds only at print. The runner already
    rounded k6's raw summary once — p95 to a tenth, the failure share to four places — and that
    record is the evidence. Rounding a second time in here looked harmless while every document
    printed whole milliseconds, but it put the registry and its own source out of step: p95 read
    98 against a recorded 97.6, so a document that wanted one decimal would have been rejected
    for printing the true number. display: decides what a page shows; value: stays as measured
  note: >-
    Checked by `report-kit figures --path examples/simple-api/figures.yaml check`.
    This file is also the shape a project's own registry takes. Every figure a point record
    holds names it with from:, so `figures pull` writes the value and `check` fails if it drifts.

scan:
  - report.md
  - execution.md
  - charts/*.csv

# What one point of the sweep adds: `report-kit figures add-point
# scripts/data/<run>.point.json`. A repeat of a rate gets the next letter, so
# r32 is run rate-32, the excluded one-replica run, and r32b its re-run. Every
# figure below belongs to one of the six points; the ones written before this
# block were bound with `figures adopt-point`.
points:
  axis: rate
  label: "r{rate:02d}"
  figures:
    offered_{point}: {kind: R, unit: req_per_second, display: 0, from: {path: rate}, source: TARGET_RATE in scripts/load.js}
    served_{point}: {kind: M, unit: req_per_second, from: {path: client.served_per_second}, source: "M1, http_reqs.rate from the k6 summary"}
    p95_{point}: {kind: M, unit: milliseconds, display: 0, from: {path: client.p95_ms}, source: "M2, http_req_duration.p(95) from the k6 summary"}
    unserved_{point}: {kind: M, unit: percent, display: 1, from: {path: client.failed_share, scale: 100}, source: "M3, http_req_failed.value"}
    share_{point}: {kind: D, unit: percent, display: 0, formula: "served_{point} / offered_{point} * 100", group: served_share}

