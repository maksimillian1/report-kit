# Prometheus scraping the mock API per pod.
#
# Pod service discovery rather than scraping the Service DNS name: behind one
# Service the scrape lands on a random pod each time, so a counter would jump
# between pods' values and every rate() over it would be fiction. One target
# per pod is also what makes "count(up == 1)" a meaningful guard.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: report-kit-example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: report-kit-example-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: report-kit-example-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: report-kit-example-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: report-kit-example
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: report-kit-example
data:
  prometheus.yml: |
    global:
      # Fast, because a demo window is minutes rather than an hour. A 15s
      # export step over a 5s scrape leaves room for rate() to work.
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: mock-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [report-kit-example]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: mock-api
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: report-kit-example
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1h
            - --web.enable-lifecycle
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: report-kit-example
spec:
  selector: {app: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: 9090}
