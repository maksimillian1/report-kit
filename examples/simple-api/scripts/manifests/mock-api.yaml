apiVersion: v1
kind: Namespace
metadata:
  name: report-kit-example
---
# The whole application: a stdlib HTTP server in a ConfigMap, run by a stock
# python image. No image to build, no registry to push to — the point of this
# example is the measurement loop, not the app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-api-src
  namespace: report-kit-example
data:
  server.py: |
    """A workload that costs something to serve and says so in /metrics."""
    import os, time, threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    POD = os.environ.get("POD_NAME", "unknown")
    BURN_MS = int(os.environ.get("BURN_MS", "40"))

    lock = threading.Lock()
    requests_total = 0
    duration_total = 0.0
    inflight = 0

    def burn(ms):
        """Real CPU, so the HPA has something to react to."""
        end = time.perf_counter() + ms / 1000.0
        x = 0
        while time.perf_counter() < end:
            x += 1
        return x

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            global requests_total, duration_total, inflight
            if self.path.startswith("/metrics"):
                with lock:
                    body = (
                        "# TYPE mock_requests_total counter\n"
                        f'mock_requests_total{{pod="{POD}"}} {requests_total}\n'
                        "# TYPE mock_request_duration_seconds_sum counter\n"
                        f'mock_request_duration_seconds_sum{{pod="{POD}"}} {duration_total:.6f}\n'
                        "# TYPE mock_inflight gauge\n"
                        f'mock_inflight{{pod="{POD}"}} {inflight}\n'
                    ).encode()
                self.respond(200, body, "text/plain; version=0.0.4")
                return
            if self.path.startswith("/healthz"):
                self.respond(200, b"ok")
                return

            with lock:
                inflight += 1
            started = time.perf_counter()
            burn(BURN_MS)
            elapsed = time.perf_counter() - started
            with lock:
                inflight -= 1
                requests_total += 1
                duration_total += elapsed
            self.respond(200, b'{"ok":true}', "application/json")

        def respond(self, code, body, ctype="text/plain"):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_):
            pass  # the access log is noise here

    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-api
  namespace: report-kit-example
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-api}
  template:
    metadata:
      labels: {app: mock-api}
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python3", "/src/server.py"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8080}
          # requests must be set or the HPA has no percentage to compute
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          volumeMounts:
            - {name: src, mountPath: /src}
      volumes:
        - name: src
          configMap: {name: mock-api-src}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-api
  namespace: report-kit-example
spec:
  selector: {app: mock-api}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mock-api
  namespace: report-kit-example
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mock-api}
  minReplicas: 1        # the floor api_point.py waits to return to
  maxReplicas: 4        # the ceiling it warns about reaching
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 2, periodSeconds: 15}]
    scaleDown:
      # Kubernetes defaults to 300s here. Shortened so the example finishes in
      # minutes — in a real sweep, leave the default and set HOLD_SECONDS
      # longer than it, or the window closes during a lull.
      stabilizationWindowSeconds: 15
      policies: [{type: Pods, value: 2, periodSeconds: 15}]
