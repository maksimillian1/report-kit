# Addresses only — what is under test lives in point.py and in the Plan.
namespace: report-kit-example
poll_seconds: 3
max_wait_seconds: 300

prometheus:
  url: http://localhost:9091
  service: svc/prometheus
  namespace: report-kit-example
  mapping: "9091:9090"

api:
  service: svc/mock-api
  namespace: report-kit-example
  mapping: "8081:80"

# {rate} {duration} {summary} {log} {run} are filled in by point.py.
# --summary-export is what M1/M2/M3 are read from: on a serving path the
# client's own view is the measurement, and Prometheus supplies the server side.
generator:
  command: ["k6", "run", "--quiet",
            "--summary-export", "{summary}",
            "-e", "TARGET_RATE={rate}",
            "-e", "DURATION={duration}",
            "-e", "BASE_URL=http://localhost:8081",
            "load.js"]
