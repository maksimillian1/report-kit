meta:
  updated: 2026-10-22
  rule: every value the two documents print exists here; each renders it at whatever precision it needs
  rounding: >-
    A value carries what the point record carries, and rounds only at print. The runner keeps
    k6's summary as k6 wrote it, unrounded, under observations.client, and metrics.yaml reads
    M1-M3 from there and works D8 out of them, so the registry and its evidence cannot drift
    apart by a rounding step taken in between. display: decides what a page shows; value: stays
    as measured
  note: >-
    Checked by `report-kit values --path examples/simple-api/report-values.yaml check`.
    This file is also the shape a project's own registry takes. Every value a run's data
    holds reads it by its register ref -- from: {metric: M2} -- so the execution's metrics.yaml
    defines it once, `values pull` writes it, `check` fails if it drifts, and `values trace`
    follows it from the page down to the point record.

scan:
  - report.md
  - execution.md
  - charts/*.csv

# What one point of the sweep adds: `report-kit values add-point
# scripts/data/<run>.point.json`. A repeat of a rate gets the next letter, so
# r32 is run rate-32, the excluded one-replica run, and r32b its re-run. Every
# value below belongs to one of the six points; the ones written before this
# block were bound with `values adopt-point`.
points:
  axis: rate
  label: "r{rate:02d}"
  values:
    offered_{point}: {kind: R, unit: req_per_second, display: 0, from: {metric: R9}}
    served_{point}: {kind: M, unit: req_per_second, from: {metric: M1}}
    p95_{point}: {kind: M, unit: milliseconds, display: 0, from: {metric: M2}}
    unserved_{point}: {kind: M, unit: percent, display: 1, from: {metric: M3, scale: 100}}
    share_{point}: {kind: D, unit: percent, display: 0, from: {metric: D8, scale: 100}, group: served_share}

