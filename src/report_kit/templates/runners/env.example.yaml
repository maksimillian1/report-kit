# env.example.yaml — addresses, never what is under test.
#
# The split this file depends on: env.yaml says WHERE things are and may
# differ between clusters; the CONSTANTS block at the top of a runner says
# WHAT MUST NOT MOVE and may not differ between points of one sweep. If you
# find yourself wanting to sweep a value from this file, it belongs in the
# runner instead — otherwise two points of the same sweep can silently
# disagree about what was measured.
#
# Copy to env.yaml and fill in. Keys only the profile you run are required.

# Default namespace, with per-workload overrides for anything living elsewhere.
namespace: app
namespaces:
  embeddings: platform
  worker: jobs

poll_seconds: 15
max_wait_seconds: 5400          # 90m — the timeout for a window to close

prometheus:
  url: http://localhost:9090
  # Present = the runner opens a tunnel itself; omit `service` if the URL is
  # already reachable.
  service: svc/prometheus-operated
  namespace: monitoring
  mapping: 9090:9090

# ---------------------------------------------------------------- api (sync)
api:
  service: svc/api
  mapping: 8080:80

# The load generator: one process, exits when the load stops. {run} {rate}
# {duration} {log} are filled in by api_point.py.
generator:
  command: ["k6", "run", "--quiet",
            "--env", "TARGET_RATE={rate}",
            "--env", "DURATION={duration}",
            "load.js"]
  env:
    BASE_URL: http://localhost:8080
    K6_LOG_OUTPUT: "{log}"

# ------------------------------------------------------------- jobs (async)
# Whatever puts work in the queue. {run} {n} {count} {log} are filled in.
producer:
  command: ["python3", "seed_queue.py", "--count", "{count}", "--workers", "{n}"]
  env:
    TARGET_QUEUE: work

sqs:
  work: https://sqs.eu-central-1.amazonaws.com/000000000000/work
  retry: https://sqs.eu-central-1.amazonaws.com/000000000000/work-retry

# Label selector matching worker nodes — the pool returning to zero is what
# says the work finished and the cost stopped.
nodepool_workers: karpenter.sh/nodepool=workers
# Label selector matching worker pods, for telling "this node had work on it"
# from "this node was already idle when it went away".
worker_selector: app=worker

# Cleared by reset.py between points; omit a section to skip that step.
s3:
  bucket: my-bucket
  prefix: incoming/
qdrant:
  url: http://localhost:6333
  collection: documents
  service: svc/qdrant
  mapping: 6333:6333
