# The metric register: what this execution reads and from where — a
# Prometheus query, a generator's summary, an outside API — each ref defined
# once. The runner in scripts/ exports every M ref that has a promql.
#
# `report-kit metrics write` renders the register table between the two
# marker lines in index.md — move the marked block to metrics.md when the
# table outgrows index.md — and `report-kit metrics check` fails when the
# table no longer matches this file. Edit here, never there.
#
# One sequence of numbers across M, D, R and E, in file order, and a number is
# never reused. An M ref's status is `confirmed YYYY-MM-DD` once its name was
# checked against the live endpoint and `unconfirmed` until then; an
# unconfirmed ref cannot appear in a frozen Plan.

metrics:
  # promql is evaluated over the point's window and written to <run>.jsonl. A
  # ref that returns no series fails the run with exit 2 — an empty result is a
  # gap, not a zero. Where zero is genuinely the answer, write it:
  # `... or vector(0)`.
  #
  # Everything else a run's data holds is worked out by the kit, so it is
  # defined once, here — not again in the runner, nor by hand:
  #   record: client.p95_ms             a field of the point record: a
  #                                     generator's summary, a run setting
  #   series: {ref: M1, reduce: max}    a reduction of an exported ref
  #   formula: M5 / settings.rate       arithmetic over refs and record fields
  # An M ref takes promql or record, a D ref formula, series or record, an R
  # ref record. source: is a sentence, for what a person decides; a D ref left
  # in one fails `report-kit metrics check --strict`. report-values.yaml reads
  # any of them by ref: from: {file: data/<run>.point.json, metric: D3}.
  M1:
    what: ⟨⟩
    promql: ⟨metric_name{selector}⟩
    status: unconfirmed
    notes: ⟨→ K1⟩
  M2:
    what: ⟨⟩
    promql: ⟨metric_name{selector}⟩
    status: unconfirmed
    notes: ⟨what blocks it⟩
  D3:
    what: ⟨⟩
    series: {ref: M1, per: M2, reduce: mean}
    status: active
  R4:
    what: ⟨the swept setting⟩
    record: settings.⟨name⟩
    status: active
  E5:
    what: ⟨⟩
    source: ⟨basis⟩ vs ⟨reference value⟩
    status: active
