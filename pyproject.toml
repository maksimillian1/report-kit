[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-kit"
version = "0.3.1"
description = "Measurement tooling and templates for engineering reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

# boto3 is needed by cloud/aws_s3.py alone; cloud/aws.py shells out to the
# aws CLI instead, so the common case installs nothing extra.
[project.optional-dependencies]
s3 = ["boto3>=1.28"]
# matplotlib is needed by tools/charts/ alone, and only to render: `charts
# --format` and `charts --check` draw nothing.
charts = ["matplotlib>=3.7"]
# The test suite only. matplotlib is here too: without it test_charts.py skips
# as a whole and the suite still reports green.
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
report-kit = "report_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Without this the templates stay behind and `init` has nothing to copy.
[tool.setuptools.package-data]
report_kit = ["API.md", "templates/**/*"]

[tool.setuptools.exclude-package-data]
report_kit = ["**/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
